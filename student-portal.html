<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Microvision – Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"/>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-brand" style="font-family:'DM Serif Display',serif;letter-spacing:1px;">🎓 Microvision <span style="font-family:'Outfit',sans-serif;font-size:13px;font-weight:400;opacity:.8;margin-left:4px;">Student Portal</span></div>
  </div>
  <div class="topbar-right">
    <button class="topbar-btn ghost" onclick="studentLogout()">🔒 Log Out</button>
  </div>
</div>

<div style="max-width:960px;margin:0 auto;padding:24px 16px;">

  <!-- Loading state, shown until the first data fetch completes -->
  <div id="portalLoading" style="text-align:center;padding:60px 0;color:var(--muted);">Loading your data…</div>

  <div id="portalContent" style="display:none;">
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div style="font-size:20px;font-weight:800;" id="pf_name">-</div>
        <div style="font-size:13px;color:var(--muted);" id="pf_meta">-</div>
      </div>
    </div>

    <!-- Fee Dues -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">💰 Fee Status</div>
        <div id="pf_feeSummary"></div>
        <div id="pf_instalments"></div>
      </div>
    </div>

    <!-- Attendance -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">📅 Attendance</div>
        <div id="pf_attendanceSummary"></div>
      </div>
    </div>

    <!-- Exam Marks -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">📝 Exam Marks</div>
        <div id="pf_exams"></div>
      </div>
    </div>

    <!-- Notices -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">📢 Notices</div>
        <div id="pf_notices"></div>
      </div>
    </div>
  </div>
</div>

<script src="student.js"></script>
<script>
/** Small local helper (portal doesn't load the admin's shared.js): formats a rupee
 * amount with a ₹ prefix, or shows ₹0 for falsy values. */
function fmtFull(n){ return '₹'+Math.round(n||0).toLocaleString('en-IN'); }

/** Builds the days-left/overdue badge for one instalment row — same logic as the
 * admin Dues page, so a student sees the same urgency signal their institute does. */
function instalmentBadge(inst){
  const today=new Date(); today.setHours(0,0,0,0);
  const dueD=new Date(inst.dueDate); dueD.setHours(0,0,0,0);
  const diffDays=Math.round((dueD-today)/(1000*60*60*24));
  if(diffDays<0) return `<span class="badge badge-red">🔴 ${-diffDays} day${-diffDays>1?'s':''} overdue (${inst.dueDate})</span>`;
  if(diffDays===0) return `<span class="badge badge-yellow">🟡 Due today</span>`;
  return `<span class="badge badge-blue">🔵 ${diffDays} day${diffDays>1?'s':''} left (${inst.dueDate})</span>`;
}

async function loadPortal(){
  const auth=requireStudentAuth(); if(!auth) return; // redirects to login if not signed in

  const data=await loadMyStudentData();
  document.getElementById('portalLoading').style.display='none';
  document.getElementById('portalContent').style.display='block';

  if(!data){
    document.getElementById('portalContent').innerHTML=
      '<div class="card"><div class="card-body" style="text-align:center;color:var(--muted);padding:30px;">'+
      'Your records haven\'t been synced yet — check back soon, or contact your institute.</div></div>';
    return;
  }

  document.getElementById('pf_name').textContent=data.name||'-';
  document.getElementById('pf_meta').textContent=(data.courseName||'-')+' • '+(data.batch||'-')+' • Reg No: '+(data.regNo||'-');

  // ── Fee Dues ──
  const total=data.totalFee||0, paid=data.feesPaid||0, due=Math.max(0,total-paid);
  const pct=total>0?Math.round(paid/total*100):0;
  document.getElementById('pf_feeSummary').innerHTML=`
    <div class="fee-bar" style="margin-bottom:6px;"><div class="fee-bar-fill ${pct<40?'danger':pct<80?'warn':''}" style="width:${pct}%"></div></div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;font-size:13px;">
      <div>Total: <b>${fmtFull(total)}</b></div>
      <div style="color:var(--green)">Paid: <b>${fmtFull(paid)}</b></div>
      <div style="color:${due>0?'var(--red)':'var(--green)'}">Due: <b>${fmtFull(due)}</b></div>
    </div>`;
  const unpaidInst=(data.instalments||[]).filter(i=>i.status!=='paid'&&i.dueDate);
  document.getElementById('pf_instalments').innerHTML = unpaidInst.length
    ? '<div style="margin-top:10px;">'+unpaidInst.map(i=>`<div style="margin-bottom:6px;">${instalmentBadge(i)} — ${fmtFull(i.amount)}</div>`).join('')+'</div>'
    : '';

  // ── Attendance ── (data.attendance is {"YYYY-MM-DD":"present"|"absent"|"leave"})
  const attEntries=Object.entries(data.attendance||{});
  if(attEntries.length===0){
    document.getElementById('pf_attendanceSummary').innerHTML='<div style="color:var(--muted);font-size:13px;">No attendance recorded yet.</div>';
  } else {
    const present=attEntries.filter(([,v])=>v==='present').length;
    const total_=attEntries.length;
    const attPct=Math.round(present/total_*100);
    const recent=attEntries.sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10);
    document.getElementById('pf_attendanceSummary').innerHTML=`
      <div style="font-size:13px;margin-bottom:10px;">Overall: <b>${attPct}%</b> present (${present}/${total_} days)</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${recent.map(([date,status])=>`<span class="badge badge-${status==='present'?'green':status==='leave'?'yellow':'red'}">${date}: ${status}</span>`).join('')}
      </div>`;
  }

  // ── Exams ──
  const exams=data.exams||[];
  document.getElementById('pf_exams').innerHTML = exams.length
    ? exams.map(e=>`<div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;">
        <div style="font-weight:700;">${e.examName}</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">${e.date||''} • ${e.course||''}</div>
        <div style="font-size:13px;">${e.totalObt}/${e.totalMax} (${Math.round(e.percentage)}%) — <b>${e.grade}</b> — ${e.result}</div>
      </div>`).join('')
    : '<div style="color:var(--muted);font-size:13px;">No exam results yet.</div>';

  // ── Notices ──
  const notices=await loadMyNotices(data);
  document.getElementById('pf_notices').innerHTML = notices.length
    ? notices.map(n=>`<div style="border-left:3px solid var(--blue);padding:8px 12px;margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0;">
        <div style="font-weight:700;font-size:13.5px;">${n.title}</div>
        <div style="font-size:13px;color:var(--text);margin-top:2px;">${n.message}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">${new Date(n.createdAt).toLocaleDateString()}</div>
      </div>`).join('')
    : '<div style="color:var(--muted);font-size:13px;">No notices right now.</div>';
}

loadPortal();
</script>
</body>
</html>
