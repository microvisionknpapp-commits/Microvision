<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Microvision – Student Portal Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"/>
</head>
<body>

<div style="position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2));
  display:flex;align-items:center;justify-content:center;z-index:1;">
  <div class="login-card">
    <div class="login-logo">🎓 Microvision</div>
    <div class="login-sub">Student Portal — Attendance, Marks &amp; Fees</div>

    <!-- LOGIN FORM (default view) -->
    <div id="loginPane">
      <div class="field" style="text-align:left;margin-bottom:12px;">
        <label>Registration No.</label>
        <input id="li_regNo" placeholder="e.g. SM01CC5073" autocomplete="username" style="text-transform:uppercase;"/>
      </div>
      <div class="field" style="text-align:left;margin-bottom:16px;">
        <label>PIN</label>
        <input id="li_pin" type="password" inputmode="numeric" maxlength="8" placeholder="4+ digit PIN" autocomplete="current-password"/>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="studentLogin(document.getElementById('li_regNo').value,document.getElementById('li_pin').value)">Log In</button>
      <div style="font-size:12.5px;color:var(--muted);">
        First time here? <a href="javascript:void(0)" onclick="showRegisterPane()" style="color:var(--blue);font-weight:600;">Register with your Reg. No.</a>
      </div>
    </div>

    <!-- REGISTER FORM (hidden by default) -->
    <div id="registerPane" style="display:none;">
      <div class="field" style="text-align:left;margin-bottom:12px;">
        <label>Registration No.</label>
        <input id="rg_regNo" placeholder="Given to you by your institute" autocomplete="off" style="text-transform:uppercase;"/>
      </div>
      <div class="field" style="text-align:left;margin-bottom:12px;">
        <label>Choose a PIN (4+ digits)</label>
        <input id="rg_pin" type="password" inputmode="numeric" maxlength="8" placeholder="Choose a PIN" autocomplete="new-password"/>
      </div>
      <div class="field" style="text-align:left;margin-bottom:16px;">
        <label>Confirm PIN</label>
        <input id="rg_pin2" type="password" inputmode="numeric" maxlength="8" placeholder="Re-enter PIN" autocomplete="new-password"/>
      </div>
      <button class="btn btn-success" style="width:100%;margin-bottom:10px;" onclick="studentRegister(document.getElementById('rg_regNo').value,document.getElementById('rg_pin').value,document.getElementById('rg_pin2').value)">Register</button>
      <div style="font-size:12.5px;color:var(--muted);">
        Already registered? <a href="javascript:void(0)" onclick="showLoginPane()" style="color:var(--blue);font-weight:600;">Log in instead</a>
      </div>
    </div>

    <div id="studentAuthError" style="color:var(--red);font-size:12.5px;font-weight:600;margin-top:14px;min-height:16px;"></div>
  </div>
</div>

<script src="student.js"></script>
<script>
// Toggle between the Login and Register panes without needing a second page.
function showRegisterPane(){
  document.getElementById('loginPane').style.display='none';
  document.getElementById('registerPane').style.display='block';
  showStudentAuthError('');
}
function showLoginPane(){
  document.getElementById('registerPane').style.display='none';
  document.getElementById('loginPane').style.display='block';
  showStudentAuthError('');
}
// If a session is already saved, skip straight to the portal instead of showing the login form.
if(localStorage.getItem('mv_student_auth')){ location.href='student-portal.html'; }
</script>
</body>
</html>
